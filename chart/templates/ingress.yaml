{{- if .Values.ui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ui
  annotations:
    {{- if .Values.ui.auth.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://{{ .Release.Name }}-oauth2-proxy.{{ .Release.Namespace }}.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ .Values.ui.ingress.host }}/oauth2/start?rd=$escaped_request_uri"
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ui.ingress.host }}
      http:
        paths:
          {{- if .Values.ui.auth.enabled }}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-oauth2-proxy
                port:
                  number: 4180
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.ui.auth.enabled }}
                name: {{ .Release.Name }}-oauth2-proxy
                port:
                  number: 4180
                {{- else }}
                name: {{ .Release.Name }}-ui
                port:
                  number: 3000
                {{- end }}
  {{- if .Values.ui.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ui.ingress.host }}
      secretName: {{ .Release.Name }}-ui-tls
  {{- end }}
{{- end }}
