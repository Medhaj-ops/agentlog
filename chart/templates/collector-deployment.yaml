apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-collector
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-collector
    spec:
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: {{ .Values.collector.resources.requests.cpu }}
              memory: {{ .Values.collector.resources.requests.memory }}
            limits:
              cpu: {{ .Values.collector.resources.limits.cpu }}
              memory: {{ .Values.collector.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-collector-config
